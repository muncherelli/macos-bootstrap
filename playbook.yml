---
- name: Install/Update Software
  hosts: all

  # A fresh macOS install stores some of these settings with a different type
  # than the one written here (for example an integer 0 where a boolean is
  # wanted). Overwrite with the wanted type, as `defaults write` would, and do
  # not stop on the mismatch.
  module_defaults:
    community.general.osx_defaults:
      check_type: false

  vars:
    # Computer Name / HostName / LocalHostName. Empty = leave the name alone.
    # Set it here, or per run:  ./update.sh -e computer_name=devbox
    computer_name: ""

    # Headless dev box: the Dock holds only the items listed in dockitems_persist.
    # Everything else is stripped by the "Clear the Dock" pre-task below, so there
    # is no remove list to maintain as macOS adds new default icons.
    dockitems_remove: []
    dockitems_persist:
      - name: "Safari"
        path: "/Applications/Safari.app"
        pos: 1
      - name: "iTerm"
        path: "/Applications/iTerm.app"
        pos: 2

    homebrew_installed_packages:
      - btop
      - colima
      - docker
      - docker-buildx
      - docker-compose
      - gh
      - go
      - iperf3
      - jq
      - nvm
      - rustup
      - tree
      - uv
      - wget

    homebrew_cask_apps:
      - iterm2

    safari_plist: "{{ ansible_facts['env']['HOME'] }}/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari.plist"

  pre_tasks:
    # The Dock, Finder, Safari and friends only exist while someone is logged in
    # at the screen (or over Screen Sharing). Over SSH with nobody logged in,
    # the steps that need them are skipped and reported at the end.
    - name: Check for a logged-in desktop session
      ansible.builtin.command: launchctl print gui/{{ ansible_facts['user_uid'] }}
      register: gui_domain
      changed_when: false
      failed_when: false
      check_mode: false
      tags: [always]

    - name: Check that the Dock has been set up for this account
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/Library/Preferences/com.apple.dock.plist"
      register: dock_plist
      tags: [always]

    - name: Remember what is available
      ansible.builtin.set_fact:
        gui_session: "{{ gui_domain.rc == 0 }}"
        dock_ready: "{{ dock_plist.stat.exists }}"
      tags: [always]

    - name: dockutil utility
      become: false
      community.general.homebrew:
        name: dockutil
        state: present

    - name: Clear the Dock (everything not in dockitems_persist)
      become: false
      ansible.builtin.shell: |
        set -o pipefail
        /opt/homebrew/bin/dockutil --list |
        awk -F'\t' -v keep="$KEEP" 'BEGIN { split(keep, k, "|"); for (i in k) wanted[k[i]] = 1 }
                                    !($1 in wanted) { print $1 }' |
        while IFS= read -r item; do
          /opt/homebrew/bin/dockutil --remove "$item" --no-restart </dev/null && echo "removed: $item" ||
            echo "could not remove: $item" >&2
        done
      args:
        executable: /bin/bash
      environment:
        KEEP: "{{ dockitems_persist | map(attribute='name') | join('|') }}"
      register: dock_clear
      changed_when: dock_clear.stdout != ""
      when: dock_ready
      notify: Restart Dock

  tasks:
    - name: Homebrew on PATH for login shells
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zprofile"
        line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
        create: yes
        mode: "0644"

    - name: Read current computer name
      ansible.builtin.command: scutil --get {{ item }}
      loop: [ComputerName, HostName, LocalHostName]
      register: current_names
      changed_when: false
      failed_when: false # HostName is unset on a fresh Mac
      check_mode: false
      when: computer_name | length > 0

    # HostName and LocalHostName cannot contain spaces or punctuation.
    - name: Set computer name
      become: true
      ansible.builtin.command: scutil --set {{ item.item }} {{ wanted | quote }}
      vars:
        wanted: "{{ computer_name if item.item == 'ComputerName' else computer_name | regex_replace('[^A-Za-z0-9-]+', '-') | regex_replace('^-+|-+$', '') }}"
      loop: "{{ current_names.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when:
        - computer_name | length > 0
        - item.stdout | default('') != wanted
      notify: Flush DNS cache

    - name: Hush login
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.hushlogin"
        state: touch
        modification_time: preserve
        access_time: preserve

    - name: Oh My Zsh
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh | sh -s -- --unattended
      args:
        executable: /bin/bash
        creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/oh-my-zsh.sh"
      environment:
        PATH: "{{ ansible_facts['env']['PATH'] }}"

    - name: Fonts directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/Library/Fonts"
        state: directory
        mode: "0755"

    # Only needed when using Terminal on this Mac itself. Over SSH the font has
    # to be installed on the machine you are connecting from.
    - name: MesloLGS NF fonts
      ansible.builtin.get_url:
        url: "https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20{{ item | replace(' ', '%20') }}.ttf"
        dest: "~/Library/Fonts/MesloLGS NF {{ item }}.ttf"
      loop:
        - Regular
        - Bold
        - Italic
        - Bold Italic

    - name: Powerlevel10k theme
      ansible.builtin.git:
        repo: "https://github.com/romkatv/powerlevel10k.git"
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k"
        depth: 1

    - name: Set ZSH_THEME
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        regexp: "^ZSH_THEME="
        line: 'ZSH_THEME="powerlevel10k/powerlevel10k"'
        create: yes

    # The prompt's look, generated once by `p10k configure`. Seeding it stops the
    # configuration wizard from starting on first login. It is only copied when
    # missing, so a later `p10k configure` on the box is kept.
    - name: Powerlevel10k prompt configuration
      ansible.builtin.copy:
        src: files/p10k.zsh
        dest: "{{ ansible_facts['env']['HOME'] }}/.p10k.zsh"
        mode: "0644"
        force: no

    - name: Powerlevel10k instant prompt at the top of .zshrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        insertbefore: BOF
        block: |
          if [[ -r "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh" ]]; then
            source "${XDG_CACHE_HOME:-$HOME/.cache}/p10k-instant-prompt-${(%):-%n}.zsh"
          fi
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR P10K INSTANT PROMPT"

    - name: Load the Powerlevel10k configuration from .zshrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        line: "[[ ! -f ~/.p10k.zsh ]] || source ~/.p10k.zsh"

    - name: macOS system defaults
      ansible.builtin.import_tasks: tasks/macos.yml
      tags: [macos]

    # Restart the affected services now, not at the end of the play, so they
    # have no time to write their old in-memory settings back over the new ones.
    - name: Apply macOS defaults
      ansible.builtin.meta: flush_handlers
      tags: [macos]

    # Keep the box reachable over SSH. -c = on mains power, which is the only
    # power source on a desktop Mac. The display may still sleep.
    - name: Never sleep; wake for network access
      become: true
      ansible.builtin.command: pmset -c sleep 0 disksleep 0 womp 1
      changed_when: false

    - name: Start up automatically after a power failure
      become: true
      ansible.builtin.command: pmset -c autorestart 1
      changed_when: false
      failed_when: false # desktop Macs only; laptops have no such setting

    - name: Restart automatically if the computer freezes
      become: true
      ansible.builtin.command: systemsetup -setrestartfreeze on
      changed_when: false
      failed_when: false # systemsetup reports a spurious error on recent macOS

    - name: Zsh plugins
      ansible.builtin.git:
        repo: "https://github.com/zsh-users/{{ item }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/{{ item }}"
        update: yes
      loop:
        - zsh-autosuggestions
        - zsh-syntax-highlighting

    - name: Enable zsh plugins in .zshrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        regexp: '^plugins=\('
        line: "plugins=(git zsh-autosuggestions zsh-syntax-highlighting)"
        state: present
        backrefs: yes

    # ~/.zshenv is the only file zsh reads for `ssh host some-command`, so PATH
    # lives there. nvm is a shell function and is loaded for interactive shells
    # only; ~/.nvm/current-bin is kept pointing at the default Node so that
    # `ssh host node` works too.
    - name: PATH for all shells in .zshenv
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshenv"
        create: yes
        mode: "0644"
        block: |
          typeset -U path
          path=(
            "$HOME/.cargo/bin" /opt/homebrew/opt/rustup/bin "$HOME/go/bin"
            "$HOME/.nvm/current-bin" /opt/homebrew/bin /opt/homebrew/sbin
            $path
          )
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR PATH"

    - name: nvm for interactive shells in .zshrc
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
        block: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "/opt/homebrew/opt/nvm/nvm.sh" ] && \. "/opt/homebrew/opt/nvm/nvm.sh"
          [ -s "/opt/homebrew/opt/nvm/etc/bash_completion.d/nvm" ] && \. "/opt/homebrew/opt/nvm/etc/bash_completion.d/nvm"
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR DEV TOOLCHAINS"

    - name: nvm directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.nvm"
        state: directory
        mode: "0755"

    - name: Node LTS via nvm
      ansible.builtin.shell: |
        export NVM_DIR="$HOME/.nvm"
        . /opt/homebrew/opt/nvm/nvm.sh
        nvm install --lts 2>&1
        nvm alias default 'lts/*' >/dev/null
        ln -sfn "$(dirname "$(nvm which default)")" "$NVM_DIR/current-bin"
      args:
        executable: /bin/bash
      register: nvm_install
      changed_when: "'is already installed' not in nvm_install.stdout"

    - name: Rust stable toolchain via rustup
      ansible.builtin.command: /opt/homebrew/opt/rustup/bin/rustup default stable
      register: rustup_default
      changed_when: "'unchanged' not in (rustup_default.stdout + rustup_default.stderr)"

    # Homebrew installs docker-compose as a standalone binary; this lets the
    # docker CLI find it as the `docker compose` plugin.
    - name: Docker CLI config directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.docker"
        state: directory
        mode: "0755"

    - name: Docker CLI plugin directory (docker compose)
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.docker/config.json"
        content: |
          {
            "cliPluginsExtraDirs": ["/opt/homebrew/lib/docker/cli-plugins"]
          }
        mode: "0644"
        force: no

  post_tasks:
    - name: Steps skipped because nobody is logged in at the screen
      ansible.builtin.debug:
        msg: >-
          No desktop session was found, so the Dock layout{{ '' if dock_ready else ' (never initialised for this account)' }},
          the Safari settings and the restarts of Dock, Finder, Control Center and
          WindowManager were skipped or deferred. Log in at the screen (or over
          Screen Sharing) and run ./update.sh again to finish them.
      when: not gui_session or not dock_ready
      tags: [always]

  # Handlers run in this order, and only when a task that notifies them changed
  # something. None of them fail the play: over SSH with nobody logged in at the
  # screen, the UI processes are not running and there is nothing to restart.
  handlers:
    - name: Flush DNS cache
      become: true
      ansible.builtin.command: dscacheutil -flushcache

    - name: Flush preferences cache
      ansible.builtin.command: killall cfprefsd
      failed_when: false

    - name: Announce appearance change
      ansible.builtin.command:
        argv:
          - osascript
          - -l
          - JavaScript
          - -e
          - |
            ObjC.import("Foundation");
            var nc = $.NSDistributedNotificationCenter.defaultCenter;
            ["AppleIconAppearanceThemeChangedNotification",
             "AppleInterfaceThemeChangedNotification",
             "NSGlassEffectDiffusionDidChangeNotification"].forEach(function (name) {
              nc.postNotificationNameObjectUserInfoDeliverImmediately($(name), null, null, true);
            });
      failed_when: false
      when: gui_session

    # SIGKILL so Finder cannot flush stale in-memory settings over the new ones.
    - name: Restart Finder
      ansible.builtin.command: killall -9 Finder
      failed_when: false
      when: gui_session

    - name: Restart Handoff
      ansible.builtin.command: killall useractivityd
      failed_when: false

    - name: Restart Dock
      ansible.builtin.command: killall Dock
      failed_when: false
      when: gui_session

    - name: Restart Control Center
      ansible.builtin.command: killall ControlCenter
      failed_when: false
      when: gui_session

    - name: Restart WindowManager
      ansible.builtin.command: killall WindowManager
      failed_when: false
      when: gui_session

    - name: Restart Spotlight
      ansible.builtin.shell: killall mds; killall Spotlight
      become: true
      failed_when: false

  roles:
    - name: geerlingguy.mac.homebrew
    - name: geerlingguy.mac.dock
      when: dock_ready
